<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Aula 05 HTML</title>
  </head>
  <body style="background-color: powderblue">
    <h1 style="background-color: aqua">Exemplo de estilos</h1>
    <p style="color: maroon; background-color: lightcoral">Eu sou laranja</p>
    <p style="color: whitesmoke; background-color: darkmagenta">Eu sou verde</p>
    <p style="font-size: 40px; background-color: goldenrod">Eu sou grande</p>
    <hr>
    <p style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">Minha fonte é diferente</p>
    <p style="font-family: Verdana, Geneva, Tahoma, sans-serif;">Minha fonte é diferente</p>
    <p style="font-family: Georgia, 'Times New Roman', Times, serif">Minha fonte é diferente</p>
    <hr>
    <h2 style="text-align: center;">Subtitulo Centralizados</h2>
    <p style="text-align: center;">Parágrafo Centralizado</p>
  </body>
</html>
