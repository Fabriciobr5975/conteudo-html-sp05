<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 08 HTML</title>
  </head>
  <body
    style="
      background-image: url(&quot;celular.png&quot;);
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-attachment: fixed;
    "
  >
    <!-- Exemplos de imagens de fundo em elementos -->
    <h2>Utilizando o background-image em elementos</h2>
    <p style="background-image: url(&quot;notebook.png&quot;)">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Quibusdam numquam
      asperiores repellat illum autem cupiditate beatae tempora voluptas, minus
      rerum distinctio, nisi labore veritatis itaque culpa dolor ex. Optio,
      aspernatur?
    </p>
  </body>
</html>
