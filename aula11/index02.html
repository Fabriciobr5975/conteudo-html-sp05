<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 11 HTML</title>
  </head>
  <body>
    <!-- Utilizando iframe no HTML -->
    <h2>Exemplos de iframe no HTML</h2>
    <iframe
      src="index.html"
      width="400"
      height="300"
      title="Iframe Exemplo"
    ></iframe>

    <hr />

    <h2>Exemplo de iframe sem borda</h2>
    <iframe
      src="index.html"
      width="400"
      height="300"
      title="Iframe Exemplo"
      style="border: none"
    ></iframe>

    <hr />

    <h2>Exemplo de iframe com borda estilizada</h2>
    <iframe
      src="index.html"
      width="400"
      height="300"
      title="Iframe Exemplo"
      style="border: 6px solid orangered"
    ></iframe>

    <hr />

    <h2>Exemplo de iframe</h2>
    <iframe
      src="index.html"
      width="400"
      height="300"
      title="Iframe Exemplo"
      style="border: 6px solid orangered"
      name="iframe1"
    ></iframe>
    
    <br>

    <a href="https://www.netflix.com/" target="iframe1">Site da Netflix</a>

    <hr>

    <iframe
      src="https://www.google.com/maps/d/embed?mid=1uyxnw5SnPSDNnQ-AKLCAMpyoPhB-U5A&ehbc=2E312F&noprof=1"
      width="800"
      height="400"
    ></iframe>
  </body>
</html>
