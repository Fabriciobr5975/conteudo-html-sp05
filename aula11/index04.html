<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 11 HTML</title>
  </head>
  <body>
    <!-- Utilizando o JavaScript para alterar atributos do HTML -->
    <h2>Exemplo de atributo em HTML alterando pelo JavaScript</h2>
    <img src="lamp.gif" width="100" height="180" id="lampada" />
    <br />
    <button onclick="interruptorLampada(true)">Acender</button>
    <button onclick="interruptorLampada(false)">Apagar</button>

    <script>
      function interruptorLampada(ligar) {
        let imagemLampada = "lamp.gif";

        if (ligar) imagemLampada = "lamp-acessa.gif";

        document.getElementById("lampada").src = imagemLampada;
      }
    </script>
  </body>
</html>
