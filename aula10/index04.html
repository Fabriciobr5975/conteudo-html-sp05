<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 10 HTML</title>
    <style>
        .teste-btn {
            background-color: goldenrod;
            border: none;
            font-size: 20px;
            font-weight: 100;
            padding: 12px;
            border-radius: 2px;
            cursor: pointer;
        }

        .teste-btn:hover {
            background-color: #58430d;
        }

    </style>
  </head>
  <body>
    <!-- Utilizando botões no HTML -->
    <h2>Exemplo de botão em HTML</h2>
    <button>Isso é um botão</button>

    <hr>

    <h2>Alterando o estilo de botão</h2>
    <button class="teste-btn">Clique agora</button>
  </body>
</html>
