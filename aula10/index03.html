<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 10 HTML</title>

    <style>
      #id-h2 {
        background-color: darkgreen;
        border: 4px solid #ad7731;
        color: burlywood;
        padding: 50px;
        text-align: center;
      }

      .class-h3 {
        background-color: crimson;
        color: coral;
        border: 3px solid tomato;
        padding: 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Exemplos de utilização do atributo id no html -->
    <h1>Exemplos de elemento com id</h1>
    <h2 id="id-h2">Esse elemento contém um id</h2>
    <h3 class="class-h3">Esse elemento contém uma classe (class)</h3>

    <hr />
    <!-- Exemplo de id com o Javascript -->
    <h2 id="elemento-h2">Olá mundo!</h2>
    <button onclick="alterarConteudo()">Clique aqui</button>
    <script>
      function alterarConteudo() {
        document.getElementById("elemento-h2").innerHTML = "Somente a dor coletiva gera a união";
      }
    </script>
  </body>
</html>
