<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 09 HTML</title>
  </head>
  <body>
    <!-- Elementos em bloco e elementos em linha -->
    <h2>
      Exemplo de elementos a nível de bloco e a nível de linha (Inline e Block
      elements)
    </h2>
    <h4>Exemplo de elemento em bloco:</h4>
    <p style="border: 2px solid black">Somente a dor coletiva gera a união</p>
    <div style="border: 2px solid black">
      Somente a dor coletiva gera a união
    </div>

    <br />
    <h4>Exemplo de elementos em linha</h4>
    <p>Somente <span style="border: 2px solid black;">dor coletiva</span> gera união</p>
  </body>
</html>
