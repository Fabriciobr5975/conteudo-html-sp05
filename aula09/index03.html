<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 09 HTML</title>
  </head>
  <body>
    <!-- Definindo lista não ordenada no HTML -->
    <h2>Exemplo de lista não ordenada em HTML (tag ul)</h2>
    <ul>
      <li>Laranja</li>
      <li>Morango</li>
      <li>Uva</li>
    </ul>

    <!-- Definindo lista ordenada no HTML -->
    <h2>Exemplo de lista ordenada em HTML (tag ol)</h2>
    <ol>
      <li>Tangerina</li>
      <li>Pêra</li>
      <li>Maça</li>
    </ol>

    <!-- Definindo lista ordenada no HTML -->
    <h2>Exemplo de lista descritiva em HTML (tag dl)</h2>
    <dl>Café</dl>
    <dd>- Bebida quente</dd>
    <dl>Suco</dl>
    <dd>- Bebida fria</dd>
  </body>
</html>
