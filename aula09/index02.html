<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 09 HTML</title>

    <style>
      table,
      th,
      td {
        border: 2px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <!-- Adicionando tabelas no HTML -->
    <h2>Definindo tabelas em HTML</h2>
    <table style="width: 100%">
      <thead>
        <tr>
          <th>Título 01</th>
          <th>Título 02</th>
          <th>Título 03</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Laranja</td>
          <td>Banana</td>
          <td>Maça</td>
        </tr>
        <tr>
          <td>20</td>
          <td>65</td>
          <td>90</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
